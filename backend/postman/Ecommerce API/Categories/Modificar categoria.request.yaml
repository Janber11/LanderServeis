$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Descripció modificada",
      "role": "admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("Response is JSON", () => {
        pm.response.to.be.json;
      });
      pm.test("success és true", () => {
        pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Descripció canviada i camp no permès ignorat", () => {
        const d = pm.response.json().data;
        pm.expect(d.description).to.eql("Descripció modificada");
        pm.expect(d).to.not.have.property("role");
      });
    language: text/javascript
order: 9000
