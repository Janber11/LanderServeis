$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Categoria temporal",
      "slug": "{{tmpSlug}}"
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set("tmpSlug", "tmp-pm-" + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => {
        pm.response.to.have.status(201);
      });
      pm.test("Response is JSON", () => {
        pm.response.to.be.json;
      });
      pm.test("success és true", () => {
        pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.environment.set("categoryTmpId", pm.response.json().data._id);
    language: text/javascript
order: 10000
