$kind: http-request
url: "{{baseUrl}}/api/categories?sort=passwordHash"
method: GET
queryParams:
  sort: passwordHash
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", () => {
        pm.response.to.have.status(400);
      });
      pm.test("Response is JSON", () => {
        pm.response.to.be.json;
      });
      pm.test("success és false", () => {
        pm.expect(pm.response.json().success).to.eql(false);
      });
      pm.test("error.code és INVALID_QUERY", () => {
        pm.expect(pm.response.json().error.code).to.eql("INVALID_QUERY");
      });
    language: text/javascript
order: 5000
