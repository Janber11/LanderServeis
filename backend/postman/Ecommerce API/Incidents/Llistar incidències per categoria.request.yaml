$kind: http-request
url: "{{baseUrl}}/api/incidents?category={{categoryId}}"
method: GET
queryParams:
  category: "{{categoryId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("Response is JSON", () => {
        pm.response.to.be.json;
      });
      pm.test("success és true", () => {
        pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("Hi ha almenys una incidència", () => {
        pm.expect(pm.response.json().results).to.be.at.least(1);
      });
    language: text/javascript
order: 3000
