$kind: http-request
url: "{{baseUrl}}/api/incidents"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "clientId": "{{userId}}",
      "title": "Categoria que no existeix",
      "category": "000000000000000000000000"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 422", () => {
        pm.response.to.have.status(422);
      });
      pm.test("Response is JSON", () => {
        pm.response.to.be.json;
      });
      pm.test("success és false", () => {
        pm.expect(pm.response.json().success).to.eql(false);
      });
      pm.test("error.code és VALIDATION_ERROR", () => {
        pm.expect(pm.response.json().error.code).to.eql("VALIDATION_ERROR");
      });
      pm.test("details apunta al camp category", () => {
        const fields = pm.response.json().error.details.map(d => d.field);
        pm.expect(fields).to.include("category");
      });
    language: text/javascript
order: 2000
