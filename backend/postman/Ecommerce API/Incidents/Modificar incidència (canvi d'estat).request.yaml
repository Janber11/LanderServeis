$kind: http-request
url: "{{baseUrl}}/api/incidents/{{incidentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "en_curso"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
        pm.response.to.have.status(200);
      });
      pm.test("Response is JSON", () => {
        pm.response.to.be.json;
      });
      pm.test("success és true", () => {
        pm.expect(pm.response.json().success).to.eql(true);
      });
      pm.test("statusHistory té 2 entrades", () => {
        pm.expect(pm.response.json().data.statusHistory).to.have.lengthOf(2);
      });
    language: text/javascript
order: 5000
