$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\"refreshToken\":\"{{refreshToken}}\"}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('401', () => pm.response.to.have.status(401));
      pm.test('REFRESH_TOKEN_REUSED', () => pm.expect(pm.response.json().error.code).to.eql('REFRESH_TOKEN_REUSED'));
    language: text/javascript
order: 8000
