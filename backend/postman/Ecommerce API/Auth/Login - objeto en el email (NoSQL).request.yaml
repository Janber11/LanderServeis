$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":{"$ne":null},"password":"cualquiera-cualquiera"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('error.code = VALIDATION_ERROR', () => pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR'));
      pm.test('No expone passwordHash', () => pm.expect(pm.response.text()).to.not.include('passwordHash'));
    language: text/javascript
order: 8000
