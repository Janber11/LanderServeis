$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"nadie.{{$timestamp}}@example.com","password":"incorrecta-incorrecta"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('error.code = INVALID_CREDENTIALS', () => pm.expect(pm.response.json().error.code).to.eql('INVALID_CREDENTIALS'));
      pm.test('mismo mensaje que con contrasena incorrecta', () => pm.expect(pm.response.json().error.message).to.eql('Email o contraseña incorrectos'));
    language: text/javascript
order: 6000
