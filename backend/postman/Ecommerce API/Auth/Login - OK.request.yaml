$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{authEmail}}","password":"{{authPassword}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('token JWT con 3 partes', () => pm.expect(pm.response.json().data.token.split('.')).to.have.lengthOf(3));
      pm.test('expiresIn es un numero positivo', () => pm.expect(pm.response.json().data.expiresIn).to.be.above(0));
      pm.test('No expone passwordHash', () => pm.expect(pm.response.text()).to.not.include('passwordHash'));
    language: text/javascript
order: 4000
