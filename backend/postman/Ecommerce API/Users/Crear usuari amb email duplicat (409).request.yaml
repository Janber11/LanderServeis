$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Altre Usuari",
      "email": "{{userEmail}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set("testPassword", "Prova-" + Date.now() + "-Aa");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", () => {
        pm.response.to.have.status(409);
      });
      pm.test("Response is JSON", () => {
        pm.response.to.be.json;
      });
      pm.test("success és false", () => {
        pm.expect(pm.response.json().success).to.eql(false);
      });
      pm.test("error.code és DUPLICATE_KEY", () => {
        pm.expect(pm.response.json().error.code).to.eql("DUPLICATE_KEY");
      });
      pm.test("details apunta al camp email", () => {
        const fields = pm.response.json().error.details.map(d => d.field);
        pm.expect(fields).to.include("email");
      });
      pm.test("No exposa passwordHash", () => {
        pm.expect(pm.response.text()).to.not.include("passwordHash");
      });
    language: text/javascript
order: 2000
