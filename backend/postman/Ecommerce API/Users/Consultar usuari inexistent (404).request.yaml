$kind: http-request
url: "{{baseUrl}}/api/users/000000000000000000000000"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", () => {
        pm.response.to.have.status(404);
      });
      pm.test("Response is JSON", () => {
        pm.response.to.be.json;
      });
      pm.test("success és false", () => {
        pm.expect(pm.response.json().success).to.eql(false);
      });
      pm.test("error.code és NOT_FOUND", () => {
        pm.expect(pm.response.json().error.code).to.eql("NOT_FOUND");
      });
    language: text/javascript
order: 6000
